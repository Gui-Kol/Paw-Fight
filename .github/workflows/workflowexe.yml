name: Build and Release Paw-Fight

on:
  push:
    tags:
      - 'v*'   # dispara quando você cria uma tag de versão, ex: v1.0.0

jobs:
  build:
    runs-on: windows-latest   # usar Windows para gerar .exe

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Configurar JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Build com Gradle
      - name: Build with Gradle
        run: ./gradlew lwjgl3:build

      # 4. Instalar Launch4j
      # 4. (Optional) Install 7zip - helps extracting downloaded JDK archives on Windows runners
      - name: Install 7zip
        run: choco install 7zip -y

      # 5. Debug: list Gradle tasks that mention construo (runs quickly, safe to keep)
      - name: List Gradle construo tasks
        shell: powershell
        run: |
          ./gradlew :lwjgl3:tasks --all | Select-String -Pattern construo || exit 0

      # 6. Build native Windows distribution using construo (runs the construo task in the lwjgl3 module)
      - name: Build native Windows distribution (construo)
        run: |
          ./gradlew :lwjgl3:construo --no-daemon --info

      # 6. Publicar no Release
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          # upload constructed native outputs and fallback artifacts (jar/distributions)
          files: |
            lwjgl3/build/construo/**
            lwjgl3/build/distributions/**
            lwjgl3/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
