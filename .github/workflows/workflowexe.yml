name: Build and Release Paw-Fight

on:
  push:
    tags:
      - 'v*'   # dispara quando você cria uma tag de versão, ex: v1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest   # usar Windows para gerar .exe

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v3

      # 4. (Optional) Install 7zip - helps to extract downloaded JDK archives on Windows runners
      - name: Install 7zip
        run: choco install 7zip -y

      # 2. Configurar JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Build com Gradle
      - name: Build with Gradle
        run: ./gradlew lwjgl3:build

      # 5. Debug: list Gradle tasks that mention construo (runs quickly, safe to keep)
      - name: List Gradle construo tasks
        shell: pwsh
        run: |
          ./gradlew :lwjgl3:tasks --all 2>&1 | Select-String -Pattern construo
          exit 0

      # 6. Build native Windows .exe distribution using construo
      - name: Build native Windows distribution (construo)
        run: ./gradlew :lwjgl3:packageWinX64 --no-daemon --info

      # 7. Publicar no Release
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: |
            lwjgl3/build/construo/dist/PawFight-winX64.zip
            lwjgl3/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
