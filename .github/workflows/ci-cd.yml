name: CI/CD Pipeline (All-in-One)

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  # 1. Lint e formatação
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Compile sources
        run: ./gradlew compileJava compileTestJava

  # 2. Build e upload de artefatos
  build-artifacts:
    needs: lint-format
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew build
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: game-build
          path: |
            lwjgl3/build/libs/*.jar
            lwjgl3/build/construo/dist/*

  # 3. Análise Qodana
  qodana:
    needs: build-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2025.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          pr-mode: false
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          upload-result: false
          push-fixes: 'none'

  # 4. Análise SonarCloud
  sonarcloud:
    needs: qodana
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew build
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=Gui-Kol_Paw-Fight
            -Dsonar.organization=SEU_ORG
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # 5. Scan de segurança
  security-scan:
    needs: sonarcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "Paw-Fight"
          scan: "."

  # 6. Auto PR para master
  auto-pr:
    needs: security-scan
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: master
          branch: ${{ github.ref_name }}
          title: "PR Criado automaticamente para adição da ${{ github.ref_name }}"
          body: "Este PR foi gerado automaticamente para adicionar a branch ${{ github.ref_name }} ao master."

  # 7. Release Drafter
  release-drafter:
    needs: security-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 8. Build multiplataforma
  build-multiplatform:
    needs: security-scan
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: LinuxX64
          - os: windows-latest
            target: WinX64
          - os: macos-latest
            target: MacX64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew build
      - name: Package
        run: ./gradlew lwjgl3:package${{ matrix.target }}

  # 9. Release Windows .exe
  release-windows:
    needs: build-multiplatform
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install 7zip
        run: choco install 7zip -y
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Build with Gradle
        run: ./gradlew lwjgl3:build
      - name: List Gradle construo tasks
        shell: pwsh
        run: |
          ./gradlew :lwjgl3:tasks --all 2>&1 | Select-String -Pattern construo
          exit 0
      - name: Build native Windows distribution (construo)
        run: ./gradlew :lwjgl3:packageWinX64 --no-daemon --info
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: |
            lwjgl3/build/construo/dist/PawFight-winX64.zip
            lwjgl3/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
