name: CI/CD Pipeline (All-in-One)

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  # 1. Lint e formatação
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Compile sources
        run: ./gradlew compileJava compileTestJava

  # 2. Análise Qodana
  qodana:
    needs: lint-format
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    env:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
    steps:
      - name: Check if Qodana is configured
        id: check
        run: |
          if [ -z "$QODANA_TOKEN" ]; then
            echo "::warning::Secret QODANA_TOKEN não configurado. Pulando análise Qodana."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Qodana Scan
        if: steps.check.outputs.enabled == 'true'
        uses: JetBrains/qodana-action@v2025.2
        with:
          pr-mode: false
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          upload-result: false
          push-fixes: 'none'

  # 3. Análise SonarCloud
  sonarcloud:
    needs: qodana
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check if SonarCloud is configured
        id: check
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::Secret SONAR_TOKEN não configurado. Pulando análise SonarCloud."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v3
        if: steps.check.outputs.enabled == 'true'
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        if: steps.check.outputs.enabled == 'true'
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        if: steps.check.outputs.enabled == 'true'
        run: chmod +x ./gradlew
      - name: Build
        if: steps.check.outputs.enabled == 'true'
        run: ./gradlew build
      - name: SonarCloud Scan
        if: steps.check.outputs.enabled == 'true'
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=Gui-Kol_Paw-Fight
            -Dsonar.organization=SEU_ORG

  # 4. Scan de segurança
  security-scan:
    needs: sonarcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "Paw-Fight"
          path: "."
          format: "HTML"
          out: "reports"
      - name: Upload dependency-check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/

  # 5. Auto PR para Main
  create-pr:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Authenticate with GitHub
        run: |
          echo "${{ secrets.PAT }}" | gh auth login --with-token

      - name: Check if PR already exists
        id: check-pr
        run: |
          PR_COUNT=$(gh pr list \
            --base main \
            --head ${{ github.ref_name }} \
            --state open \
            --json number \
            --jq 'length')

          if [ "$PR_COUNT" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "PR ja existe para esta branch"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum PR encontrado, criando novo"
          fi

      - name: Create Pull Request
        if: steps.check-pr.outputs.exists == 'false'
        run: |
          PR_BODY=$(cat <<'EOF'
          Informacoes do PR Automatico

          Branch de Origem: ${{ github.ref_name }}
          Branch de Destino: main

          Este PR foi gerado automaticamente pelo workflow de auto-PR.

          Checklist antes do merge:
          - [ ] Revisar alteracoes
          - [ ] Validar que os testes passaram
          - [ ] Verificar se nao ha conflitos
          - [ ] Confirmar que a branch esta atualizada
          EOF
          )

          gh pr create \
            --title "PR Automatico: Merge de ${{ github.ref_name }} para main" \
            --body "$PR_BODY" \
            --base main \
            --head ${{ github.ref_name }}

      - name: Update PR if exists
        if: steps.check-pr.outputs.exists == 'true'
        run: |
          echo "PR ja existe para a branch ${{ github.ref_name }}"
          gh pr list --base main --head ${{ github.ref_name }}


  # 6. Release Drafter
  release-drafter:
    needs: security-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 7. Build multiplataforma
  build-multiplatform:
    needs: security-scan
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: LinuxX64
          - os: windows-latest
            target: WinX64
          - os: macos-latest
            target: MacX64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew build
      - name: Package
        run: ./gradlew lwjgl3:package${{ matrix.target }}

  # 8. Release Windows .exe
  release-windows:
    needs: build-multiplatform
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install 7zip
        run: choco install 7zip -y
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Build with Gradle
        run: ./gradlew lwjgl3:build
      - name: List Gradle construo tasks
        shell: pwsh
        run: |
          ./gradlew :lwjgl3:tasks --all 2>&1 | Select-String -Pattern construo
          exit 0
      - name: Build native Windows distribution (construo)
        run: ./gradlew :lwjgl3:packageWinX64 --no-daemon --info
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lwjgl3/build/construo/dist/PawFight-winX64.zip
            lwjgl3/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
