name: Auto PR para Main

on:
  push:
    branches:
      - '**'
      - '!main'  # Exclui a branch main
  workflow_dispatch:

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Check if PR already exists
        id: check-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verifica se já existe um PR aberto dessa branch para main
          PR_COUNT=$(gh pr list \
            --base main \
            --head ${{ github.ref_name }} \
            --state open \
            --json number \
            --jq 'length')

          if [ "$PR_COUNT" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "PR já existe para esta branch"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum PR encontrado, criando novo"
          fi

      - name: Create Pull Request
        if: steps.check-pr.outputs.exists == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const headBranch = '${{ github.ref_name }}';
            const baseBranch = 'main';

            const bodyText = 'Informacoes do PR Automatico\n' +
              '- Branch de Origem: ' + headBranch + '\n' +
              '- Branch de Destino: ' + baseBranch + '\n\n' +
              'Este PR foi gerado automaticamente pelo workflow de auto-PR.\n\n' +
              'Checklist antes do merge:\n' +
              '- Revisar alteracoes\n' +
              '- Validar que os testes passaram\n' +
              '- Verificar se nao ha conflitos\n' +
              '- Confirmar que a branch esta atualizada\n\n' +
              'Este PR foi criado automaticamente. Sinta-se a vontade para edita-lo conforme necessario.';

            try {
              const pr = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'PR Automatico: Merge de ' + headBranch + ' para ' + baseBranch,
                body: bodyText,
                head: headBranch,
                base: baseBranch,
                maintainer_can_modify: true
              });

              console.log('PR criado com sucesso: #' + pr.data.number);
              console.log('URL: ' + pr.data.html_url);
            } catch (error) {
              if (error.message && error.message.includes('Validation Failed')) {
                console.log('PR ja existe ou nao ha alteracoes para fazer merge');
              } else {
                throw error;
              }
            }

      - name: Update PR if exists
        if: steps.check-pr.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "ℹ️ PR já existe para a branch ${{ github.ref_name }}"
          echo "Você pode visualizá-lo com: gh pr list --base main --head ${{ github.ref_name }}"

